[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cold-outreach-tracker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "pydantic-settings>=2.2,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
    "google-api-python-client>=2.120,<3.0",
    "google-auth-httplib2>=0.2,<1.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "anthropic>=0.28,<1.0",
]

[project.scripts]
outreach-track = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
